<style>html, body { margin: 0; height: 100%; } body { background: #040C08; }
  /* Brand green from the very first paint when the intro will play (no paper → green flash while modules load). */
  html.cqa-preintro body { background: #05532F; } html.cqa-preintro #cqa-app { visibility: hidden; }</style>
<script>
  (function () {
    try {
      var p = new URLSearchParams(location.search).get('intro');
      var seen = sessionStorage.getItem('cqa.intro.seen') === '1';
      if (p === '1' || (p !== '0' && !seen)) {
        document.documentElement.classList.add('cqa-preintro');
        setTimeout(function () { document.documentElement.classList.remove('cqa-preintro'); }, 4000);
      }
    } catch (e) { /* storage blocked: the splash decides on its own */ }
  })();
</script>

<div class="cqa-root" id="cqa-app" data-theme="dark">
